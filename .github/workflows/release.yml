# A release from its tag (docs/releasing.md): a pushed tag vMAJOR.MINOR[-beta[.N]] that names headset.json's
# version runs every CI check on the tagged commit (skipped when its tree passed against the same overpressure
# already), then makes the GitHub release overpressure downloads (python -m overpressure headset add phoenix_enterprise):
# the tag's first line as its title, the tag's own words and the changelog since the release before as its
# notes (overpressure's scripts/release.py, as overpressure's own release), the source zip (git archive:
# headset.json carries the commit and its time) and its checksum. No image, package or vendor file is
# attached.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # an earlier pass of the same tree

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The checkout's tag is a lightweight copy; the annotated tag carries the release's own words.
      - name: The tag itself
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4" # overpressure's start scripts'
      # overpressure's release tooling: the tag check, the notes and the private-data scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overpressure/overpressure
          path: .overpressure
      - name: The tag names headset.json's version
        id: version
        run: |
          kind=$(python3 .overpressure/scripts/release.py check "$GITHUB_REF_NAME" --version-file headset.json)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "name=phoenix_enterprise-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Annotated, on main
        run: |
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || { echo "::error::$GITHUB_REF_NAME is not annotated: git tag -a"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Notes and changelog
        id: notes
        run: |
          title=$(python3 .overpressure/scripts/release.py notes "$GITHUB_REF_NAME" --title "PICO 4 Enterprise")
          echo "title=$title" >> "$GITHUB_OUTPUT"
          cat notes.md
      # The tag's own words are published as they are: nothing private in them (the history scan reads commits).
      - name: Nothing private in the notes
        run: |
          mkdir -p published && cp notes.md CHANGELOG.md published/
          python3 .overpressure/scripts/check-private.py --files published/notes.md published/CHANGELOG.md
      - name: The source zip
        run: |
          name=${{ steps.version.outputs.name }}
          git archive --format=zip --prefix="$name/" --add-file=CHANGELOG.md -o "$name.zip" "$GITHUB_REF_NAME"
          sha256sum "$name.zip" > "$name.zip.sha256"
          unzip -p "$name.zip" "$name/headset.json"
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          name=${{ steps.version.outputs.name }}
          flag=""
          [ "${{ steps.version.outputs.kind }}" = prerelease ] && flag=--prerelease
          gh release create "$GITHUB_REF_NAME" $flag --verify-tag \
            --title "$TITLE" --notes-file notes.md \
            "$name.zip" "$name.zip.sha256"
